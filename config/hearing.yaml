  avoidance_targets: "何を遠ざけたいのか、まだ分かっていない。"
  protective_factors: "何を守ろうとしているのか、まだ分かっていない。"
  context_dependencies: "場面によってどう変わるのか、まだ分かっていない。"
  tensions: "引っ張り合っているものが何か、まだ分かっていない。"
