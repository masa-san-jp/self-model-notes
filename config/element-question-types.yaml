contract_version: element-question-types/v1
revision: 1
owner_review: pending
# Initial proposals for owner review. Order is the deterministic tie-breaker.
# Each default type asks about an already recorded Event, not an assumed problem.
sections:
  tensions:
    - id: tensions-thought
      question: この出来事のとき、まず考えたことは何ですか？
      scope_terms: [この出来事のとき]
    - id: tensions-choice
      question: この出来事のとき、自分の選び方はどんな選び方でしたか？
      scope_terms: [この出来事のとき]
    - id: tensions-feeling
      question: この出来事のとき、自分の気持ちはどんな気持ちでしたか？
      scope_terms: [この出来事のとき]
  recurring_patterns:
    - id: patterns-scene
      question: この出来事のとき、一番印象に残った場面はどんな場面でしたか？
      scope_terms: [この出来事のとき]
    - id: patterns-action
      question: この出来事のとき、最初にしたことは何ですか？
      scope_terms: [この出来事のとき]
    - id: patterns-process
      question: この出来事のとき、自分の進め方はどんな進め方でしたか？
      scope_terms: [この出来事のとき]
  seeks:
    - id: seeks-wish
      question: この出来事のとき、自分が望んでいたことは何ですか？
      scope_terms: [この出来事のとき]
    - id: seeks-attention
      question: この出来事のとき、一番心が向いたものは何ですか？
      scope_terms: [この出来事のとき]
    - id: seeks-next
      question: この出来事のとき、次にしたかったことは何ですか？
      scope_terms: [この出来事のとき]
  avoids:
    - id: avoids-concern
      question: この出来事のとき、一番気になったことは何ですか？
      scope_terms: [この出来事のとき]
    - id: avoids-distance
      question: この出来事のとき、周りとの距離の取り方はどんな取り方でしたか？
      scope_terms: [この出来事のとき]
    - id: avoids-pace
      question: この出来事のとき、自分のペースはどんなペースでしたか？
      scope_terms: [この出来事のとき]
  protects:
    - id: protects-value
      question: この出来事のとき、自分が大事にしていたことは何ですか？
      scope_terms: [この出来事のとき]
    - id: protects-support
      question: この出来事のとき、自分を支えていたものは何ですか？
      scope_terms: [この出来事のとき]
    - id: protects-own-way
      question: この出来事のとき、自分らしいと思う部分はどんな部分でしたか？
      scope_terms: [この出来事のとき]
  states:
    - id: states-feeling
      question: この出来事のとき、自分の気持ちはどんな気持ちでしたか？
      scope_terms: [この出来事のとき]
    - id: states-impression
      question: この出来事のとき、一番印象に残ったことは何ですか？
      scope_terms: [この出来事のとき]
    - id: states-reaction
      question: この出来事のとき、自分の反応はどんな反応でしたか？
      scope_terms: [この出来事のとき]
  contexts:
    - id: contexts-childhood
      question: 小さい頃のこの出来事のとき、今でも印象に残る場面はどんな場面でしたか？
      scope_terms: [小さい頃, この出来事のとき]
      requires_event_text: [小さい頃]
    - id: contexts-scene
      question: この出来事のとき、周りの様子はどんな様子でしたか？
      scope_terms: [この出来事のとき]
    - id: contexts-place
      question: この出来事のとき、自分がいた場所はどんな場所でしたか？
      scope_terms: [この出来事のとき]
    - id: contexts-attention
      question: この出来事のとき、自分が目を向けていたものは何ですか？
      scope_terms: [この出来事のとき]
