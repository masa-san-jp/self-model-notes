      - Current subject JSON and Markdown are generated and Git-tracked
      - JSON satisfies self-model/v2
      - source_commit is a deterministic 40-character entity commit and not the artifact commit
      - Derived statements trace to entity and evidence
      - No raw voice, direct identifiers, third-party identifiers, or Source locator is newly exposed
